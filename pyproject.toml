[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil"
version = "0.1.0"
description = "Face scan -> live social search -> tamper-evident on-chain record"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nikhilcherry" }]
keywords = ["face-recognition", "blockchain", "provenance", "atproto", "bluesky"]

dependencies = [
    "web3>=7.0",
    "eth-tester[py-evm]>=0.12",
    "py-solc-x>=2.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "requests>=2.31",
    "rich>=13.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    "onnxruntime>=1.17",
    "Pillow>=10",
]

[project.optional-dependencies]
# The accurate face backend. Heavier (pulls scipy/scikit-image and a ~300 MB
# model pack on first run), so it is opt-in rather than a hard dependency.
insight = ["insightface>=0.7", "scikit-image>=0.22"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
sigil = "sigil.cli:main"

[project.urls]
Repository = "https://github.com/nikhilcherry/sigil"

[tool.setuptools.packages.find]
include = ["sigil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live third-party APIs; deselect with -m 'not network'"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]
