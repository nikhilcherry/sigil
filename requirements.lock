# A known-good dependency snapshot. Not the dependency list.
#
# pyproject.toml is the source of truth, mirrored by requirements.txt and kept
# in step with it by tests/test_packaging.py. Both use `>=` ranges on purpose,
# so CI installs whatever resolves latest on every push and a breaking upstream
# release shows up as a red badge rather than silently.
#
# This file is the other half of that trade: the exact versions this project
# was last verified against. Every figure the README quotes - the test count,
# the coverage, the measured rates, the gas numbers - was produced on these. If
# the loose resolution moves under you and something breaks, this reproduces a
# working install:
#
#   python -m venv .venv
#   .venv/bin/pip install -r requirements.lock -e .
#
# Captured from a clean clone on Python 3.12, 2026-09-03, with the `.[dev]`
# extra - the install a fresh clone actually performs. Verified by installing
# a fresh clone from this file alone and running the suite. Regenerate with:
#
#   uv pip freeze --python .venv/bin/python \
#     | grep -E '^[A-Za-z0-9._-]+==[0-9]' | grep -v '^sigil==' | sort
#
# The grep is not decoration: uv writes a status line to stdout, and the
# editable self-reference it emits carries an absolute path from whatever
# machine generated it.
